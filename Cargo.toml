[package]
name = "markhaus"
version = "0.1.0"
edition = "2024"
description = "An on-demand Markdown reader with Bauhaus-inspired styling"
license = "MIT"

[dependencies]
ammonia = "4"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
percent-encoding = "2"
pulldown-cmark = "0.13"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
walkdir = "2"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
